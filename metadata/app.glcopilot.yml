AutoName: SokeriPilot
Summary: CGM value and alerts beside Android Auto navigation
Description: |
  SokeriPilot shows your CGM data where you actually look while driving: a
  silent, persistent Android Auto notification beside Maps or music, and a
  one-tap cockpit with the value, trend, band and reading age.

  It reads the value the CGM app already posts as a notification (Dexcom,
  FreeStyle LibreLink, Libre 3, xDrip+, Juggluco, Diabox, CamAPS FX,
  AndroidAPS) after one Android notification-access grant. Nothing is
  configured inside the sensor app, and xDrip+ broadcasts or your own
  Nightscout server stay optional.

  No account, no analytics, no advertising SDK. Readings are not archived by
  the app. It is not a medical device and does not recommend doses.
