name: checks

on:
  push:
  pull_request:

jobs:
  web:
    name: Landing and release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Security and code checks
        run: node tools/security-check.mjs
      - name: Release consistency
        run: node tools/release-check.mjs
      - name: Android resource XML
        run: python3 tools/check_xml.py
      - name: Landing smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory landing &
          sleep 1
          node tools/smoke.mjs
      - name: Release tool is idempotent
        run: node tools/release.mjs --apk landing/download/GlucoPilot-$(node -p "require('./landing/releases.json').current").apk

  android:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Point Gradle at the CI SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest
