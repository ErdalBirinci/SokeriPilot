name: checks

on:
  push:
  pull_request:

jobs:
  web:
    name: Landing and release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Security and code checks
        run: node tools/security-check.mjs
      - name: Release consistency
        run: node tools/release-check.mjs
      - name: Android resource XML
        run: python3 tools/check_xml.py
      - name: Landing smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory landing &
          sleep 1
          node tools/smoke.mjs
      - name: Release tool is idempotent
        run: node tools/release.mjs --apk landing/download/SokeriPilot-$(node -p "require('./landing/releases.json').current").apk

  android:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner already ships an SDK; android-actions/setup-android calls
      # `sdkmanager tools`, a package that no longer exists, so accept the
      # licenses and install only what the build needs.
      - name: Install SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Point Gradle at the CI SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest
      # The tests above write build/reports/phone-screen.png and trend-image.png;
      # this fails when docs/images no longer matches that layout.
      - name: README screenshots match the layout
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/doc-images.py --check
